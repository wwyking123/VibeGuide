<script>
'use strict';
const $=s=>document.querySelector(s);
const icon=(name,small=false)=>`<svg class="icon${small?' small':''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='vibeguide-harness-demo-v2';
const initial={stage:2,pluginEnabled:true,panelOpen:true,paneTab:'guide',panelView:'current',company:'远山制造',goal:'做一个专业、简洁的公司介绍网页，展示公司、业务和案例，让客户通过电话或邮箱联系我们。',revision:1,decisionRevision:0,questionVersion:1,answeredQuestionVersion:null,choice:null,choiceRevision:null,candidate:'ai',answerDraft:'',composerDraft:'',sentReply:'',checks:[false,false,false],report:null,amendments:[],buildPhase:-1};
const freshState=()=>({...initial,checks:[false,false,false],amendments:[]});
let state=freshState();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved.company==='string'&&typeof saved.goal==='string'&&Array.isArray(saved.checks)&&Array.isArray(saved.amendments)){state={...state,...saved,stage:Math.min(4,Math.max(0,Number(saved.stage)||0)),checks:[0,1,2].map(i=>Boolean(saved.checks[i])),buildPhase:-1};}}catch{}
let toastTimer,buildTimer,returnFocus=null,panelReturnFocus=null,panelContent='',panelLabel='';
const stages=[['提出需求','把想法交给同一个会话','在 Harness 中直接说需求，VibeGuide 随时可以帮助你整理。'],['理解方案','开发方案 · 原会话','技术原文保留在这里，点击旁边的解释入口查看实际影响。'],['回答问题','内容维护方式 · 等待你的回答','原生问题仍在输入区；右侧是同一道问题的辅助解释。'],['查看成果','页面预览 · 示例结果','宿主展示开发结果，插件帮助你了解它覆盖了哪些需求。'],['核对结果','对照目标检查','你可以记录亲自检查过的结果；未验证的内容仍然保留。']];
const choices={
 ai:{native:'不接入 CMS，直接修改前端内容',title:'偶尔更新，让 AI 帮我修改',desc:'改文字和案例时，再请 AI 修改网站；第一版不用额外做编辑后台。',reply:'不接入 CMS，直接修改前端内容'},
 team:{native:'需要 CMS，请先补充内容管理与发布方案',title:'同事需要自己更新内容',desc:'需要一个编辑后台，以及登录和权限。AI 应先补充这部分方案与维护成本。',reply:'需要 CMS，请先补充内容管理与发布方案'},
 unsure:{native:'暂不决定，先澄清内容维护需求',title:'还没想好，先帮我判断',desc:'先弄清谁来改、多久改一次；现在不替你决定要不要后台。',reply:'暂不决定，先澄清内容维护需求'}
};
if(!Object.hasOwn(choices,state.candidate)&&state.candidate!=='custom')state.candidate='ai';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),4200);}
function questionAnswered(){return state.answeredQuestionVersion===state.questionVersion;}
function stale(){return !!state.choice&&(state.choiceRevision!==state.revision||!questionAnswered());}
function replyText(){return state.candidate==='custom'?state.answerDraft.trim():choices[state.candidate].reply;}
function canSend(){return !questionAnswered()&&Boolean(replyText());}
function selectCandidate(key){if(questionAnswered()||(!Object.hasOwn(choices,key)&&key!=='custom'))return false;state.candidate=key;save();return true;}
function updateAnswerDraft(text){if(questionAnswered())return false;state.answerDraft=text;state.candidate='custom';save();return true;}
function commitDecision(){if(!canSend())return false;state.sentReply=replyText();state.choice=state.candidate;state.choiceRevision=state.revision;state.answeredQuestionVersion=state.questionVersion;state.decisionRevision++;state.checks=[false,false,false];save();return true;}
function reopenQuestion(){state.questionVersion++;state.checks=[false,false,false];save();}
function setPluginEnabled(enabled){state.pluginEnabled=enabled;if(!enabled&&state.paneTab==='guide')state.panelOpen=false;save();}
function reportIsCurrent(){return !!state.report&&state.report.revision===state.revision&&state.report.decisionRevision===state.decisionRevision&&state.report.questionVersion===state.questionVersion;}
function checksUnsaved(){return reportIsCurrent()&&JSON.stringify(state.report.checks)!==JSON.stringify(state.checks);}
function recordChecks(){state.report={count:state.checks.filter(Boolean).length,checks:[...state.checks],revision:state.revision,decisionRevision:state.decisionRevision,questionVersion:state.questionVersion};save();}
function reportTitle(){return !reportIsCurrent()?'旧版本的检查记录':checksUnsaved()?'勾选已更改，尚未保存':'已保存人工检查记录';}
function reportMessage(){return !reportIsCurrent()?'目标或问题已变化，这份记录不适用于当前状态。':checksUnsaved()?'请再次保存当前勾选；上次记录尚未改变。':'这不是自动测试通过，也不代表项目已经发布。';}
function button(text,act,kind='primary',ico='arrow'){return `<button type="button" class="btn ${kind}" data-act="${act}">${text}${ico?icon(ico,true):''}</button>`;}
function callout(text,warn=false){return `<div class="callout${warn?' warning':''}">${icon(warn?'info':'eye')}<div>${text}</div></div>`;}
function userMessage(text){return `<div class="user-message"><div class="user-bubble">${esc(text)}</div></div>`;}
function agentMessage(text,original,explainLabel='解释这段方案'){return `<div class="agent-message"><span class="agent-avatar">${icon('spark',true)}</span><div class="agent-body"><div class="agent-name">DeepSeek <span>示例消息</span></div><p>${text}</p>${original?`<details class="original"><summary>查看完整技术说明</summary><pre>${esc(original)}</pre></details>`:''}${state.pluginEnabled?`<div class="message-actions"><button type="button" class="explain-btn" data-act="open-guide">${icon('compass',true)} ${explainLabel}</button></div>`:''}</div></div>`;}
function guide(content,label){panelContent=content;panelLabel=label;return '';}
function intro(){return `<div class="page-intro"><div class="intro-meta"><span class="dot"></span> 原会话 · 预设场景</div><h1 tabindex="-1" id="page-title">${stages[state.stage][1]}</h1><p>${stages[state.stage][2]}</p></div>`;}
function flow(){return `<div class="flow" aria-label="计划中的浏览顺序">${[['building','了解公司'],['grid','浏览业务'],['case','查看案例'],['mail','联系团队']].map(([i,t],n)=>`${n?'<span class="flow-arrow">→</span>':''}<div class="flow-item"><span class="flow-icon">${icon(i,true)}</span>${t}</div>`).join('')}</div>`;}
function stageIdea(){return userMessage(state.goal)+agentMessage('我会先确认展示内容和联系方式，再整理页面方案。公司介绍、Logo 和案例资料尚未提供的部分，会使用明确标记的占位内容。',null,'帮我整理需求')+guide(`<div class="guide-eyebrow">从你的目标开始</div><h2>先说想做什么，<br>不必先选技术。</h2><p class="guide-sub">你仍然在原会话里提需求。这里帮你把目标记下来，后续方案和结果都对照它检查。</p><div class="context-block" style="margin-top:21px"><div class="eyebrow">当前目标</div><p>${esc(state.goal)}</p></div>${callout('<strong>资料还没齐，也可以先讨论范围</strong><br>缺少公司资料、图片和联系方式时，应保留占位说明。')}${button('调整这次的目标','edit-goal','small ghost','edit')}`,'整理需求');}
function stagePlan(){return userMessage(state.goal)+agentMessage('建议使用 React + Vite 构建单页站点，采用响应式布局。第一版不接数据库和服务端表单，电话与邮箱作为联系入口。CMS 是否接入取决于内容维护需求。','实现范围：公司介绍、业务、案例与联系方式。通过 CSS 响应式布局适配不同屏幕。当前不提供内容管理后台、用户认证或服务端表单处理。上线环境和域名另行确认。')+guide(`<div class="guide-eyebrow">这段方案对你意味着什么</div><h2>客户能了解公司，<br>然后找到你。</h2><p class="guide-sub">手机和电脑都能浏览。客户通过电话或邮箱联系，不在网站上留言。</p>${state.revision>1?callout(`<strong>目标已更新到第 ${state.revision} 版</strong><br>下方仍是预设方案，尚未由真实 AI 根据新目标重写。`,true):''}${flow()}<div class="two-cols"><div><div class="col-title">${icon('check',true)} 本轮覆盖</div><ul class="list"><li>${icon('check')}公司、业务、案例与联系信息</li><li>${icon('check')}手机与电脑的浏览布局</li></ul></div><div><div class="col-title muted">尚未包含</div><ul class="list negative"><li>同事自行编辑内容的后台</li><li>在线留言、域名与公开上线</li></ul></div></div>${callout('<strong>可以先做本地预览</strong><br>这是常见展示网页的实现路径。公司资料和上线条件仍需补齐，不能把“可做”当成“已验证”。')}<div class="card-actions">${button('这和我想的不一样','edit-goal','ghost','edit')}${button('查看示例问题','next-question','small','arrow')}</div>`,'理解方案');}
function choicePanel(){const answered=questionAnswered();return `<div class="guide-eyebrow">技术问题 → 你能判断的选择</div><h2>以后，谁来更新<br>网站上的内容？</h2><p class="guide-sub">“CMS”就是内容编辑后台。AI 真正想确认的是：你是否需要像编辑文档一样，自己改网站。</p><div class="guide-question-ref">关联原题 <code>content-maintenance · v${state.questionVersion}</code><br>${answered?'已回复 · 此问题已锁定':'原题与这里共享同一选择 · 尚未发送'}</div><div class="choice-list" role="radiogroup" aria-label="用日常语言选择内容更新方式">${Object.entries(choices).map(([key,c])=>`<label class="choice"><input type="radio" name="update-choice" value="${key}" ${state.candidate===key?'checked':''} ${answered?'disabled':''}><span><span class="choice-title">${c.title}</span><span class="choice-desc">${c.desc}</span></span></label>`).join('')}<label class="choice"><input type="radio" name="update-choice" value="custom" ${state.candidate==='custom'?'checked':''} ${answered?'disabled':''}><span><span class="choice-title">都不符合，我自己描述</span><span class="choice-desc">在原问题中写下需求，保留你的原话，不强行套用已有选项。</span></span></label></div><div class="reply-preview"><div class="eyebrow">${answered?'本地演示已记录的回复':'原问题将发送 · 仍需你点击发送'}</div><div id="reply-text">${esc(answered?state.sentReply:replyText()||'等待你在原问题中填写自己的需求…')}</div></div>${state.candidate==='team'?callout('<strong>这会扩大第一版的范围</strong><br>展示页面之外，还需补充登录、内容编辑、发布与维护的方案。后面的预制网页并不包含这些功能。',true):state.candidate==='unsure'?callout('<strong>可以先不决定</strong><br>先告诉 AI 谁负责更新、大约多久更新一次。它应该据此继续澄清。'):state.candidate==='custom'?callout('<strong>你的原话会直接保留</strong><br>此原型不自动解释未知文本，也不会把它改成“同意推荐方案”。'):''}<div class="card-actions">${button(answered?'查看原题记录':'到原问题回复','focus-answer',answered?'ghost':'primary',answered?'eye':'arrow')}</div><p class="form-note">这里只帮助理解与改选。发送发生在 Harness 原生问题中。</p>`;}
function stageChoice(){const answered=questionAnswered();return userMessage(state.goal)+agentMessage('页面内容可以先按展示站点组织。在确定实现范围前，需要确认是否接入 CMS，以支持后续内容维护。','不接入 CMS 时，内容变更需要修改前端源文件；接入 CMS 时，需要补充内容模型、编辑界面、身份认证、权限和发布流程。','解释这道问题')+`<div class="tool-event"><div class="flex">${icon('message',true)}<strong>ask_user_question</strong><span class="tag ${answered?'green':'orange'}">${answered?'已回答':'等待回答'}</span></div><small>内容维护方式 · v${state.questionVersion} · 原生提问位于会话输入区</small></div>${answered?`<div class="native-receipt" id="answer-receipt" tabindex="-1"><strong>${icon('check',true)} 原题已回答 · 本地演示</strong><p>${esc(state.sentReply)}</p><small>记录在本原型中，未发送到真实 Harness。</small><details class="original settled-question"><summary>查看原问题与全部选项 · 只读</summary><p>是否需要接入 CMS，以支持内容维护？</p><ul>${Object.entries(choices).map(([key,c])=>`<li>${state.choice===key?'✓ ':''}${esc(c.native)}</li>`).join('')}</ul>${state.choice==='custom'?'<small>本次使用自定义回答，未选择固定选项。</small>':''}</details><div style="margin-top:12px">${button('开启一轮新的需求确认','reopen-question','small ghost','undo')}</div></div><div class="conversation-next">${button('查看预制页面示意','go-preview','small','eye')}</div>`:''}${!state.pluginEnabled?'<div class="guide-disabled-note">VibeGuide 已关闭。仍可在下方原生问题中选择、填写和回复；草稿已保留。</div>':''}`+guide(choicePanel(),'解释问题');}
function previewTile(){return `<button type="button" class="preview-tile" data-act="open-preview" aria-label="打开公司网站预制示意"><div class="mini-browser"><i></i><i></i><i></i><span>${esc(state.company)} / 预制示意页面</span></div><div class="site-thumb"><div class="thumb-text"><small>YUANSHAN MANUFACTURING</small><h3>把每一份信任，<br>做成可靠的交付。</h3></div><div class="thumb-art" aria-hidden="true"></div></div><div class="preview-tile-foot"><span>${esc(state.company)} · 公司介绍页</span><span>打开示意 ${icon('arrow',true)}</span></div></button>`;}
function stagePreview(){const labels=[['整理展示内容','公司、业务、案例与联系信息'],['调整页面布局','演示电脑与窄屏两种排版'],['准备本地预览','预制页面已内置，可随时打开']];return agentMessage('这是预先编写的公司展示页，用于体验预览流程。它没有连接真实项目，也不是根据当前输入生成的结果。',null,'这覆盖了哪些需求？')+previewTile()+`<p class="host-footnote">预览入口属于宿主结果区；关闭 VibeGuide 后仍可打开。</p>`+guide(`<div class="guide-eyebrow">把进展放回你的目标里</div><h2>现在能看到什么？</h2><p class="guide-sub">公司、业务、案例与联系区域已有示意。资料和联系方式仍是占位内容。</p><div class="timeline">${labels.map(([a,b],i)=>`<div class="timeline-item ${state.buildPhase>i?'done':state.buildPhase===i?'active':''}"><span class="timeline-dot">${state.buildPhase>i?icon('check',true):state.buildPhase===i?icon('clock',true):`<span style="font-size:10px">${i+1}</span>`}</span><div><p>${a}</p><small>${b}</small></div></div>`).join('')}</div><div style="margin-top:14px">${button(state.buildPhase===3?'重播过程示意':'播放过程示意','play-build','small ghost','play')}</div><p class="form-note">仅播放预设动画，不代表真实开发进度。</p>${state.choice==='team'?callout('<strong>你要的编辑后台还不在这里</strong><br>此预览只有展示页面，不能作为后台需求已经实现的证据。',true):''}${stale()?callout('<strong>旧决定需要重新核对</strong><br>当前目标或问题已变化；这个预览并未随之更新。',true):''}<div class="card-actions">${button('补充调整意见','edit-goal','ghost','edit')}${button('查看验收示例','go-check','small','arrow')}</div>`,'查看成果');}
function stageCheck(){const rows=[['页面内容符合预期','我已查看公司、业务、案例与联系区域。'],['窄屏内容可以阅读','我已切换窄屏示意，检查文字与布局。'],['知道哪些还未完成','资料是占位示例，联系方式待补齐，尚未上线。']];return agentMessage('预制示意页面可以打开检查。真实项目的测试、内容完整性和公开访问状态尚未验证。',null,'帮我对照目标检查')+previewTile()+guide(`<div class="guide-eyebrow">由你确认实际体验</div><h2>这符合你最初<br>想要的结果吗？</h2><p class="guide-sub">打开页面后，勾选你亲自检查过的项目。</p><div class="checklist">${rows.map(([title,desc],i)=>`<label class="check-row"><input type="checkbox" name="check" value="${i}" ${state.checks[i]?'checked':''}><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}</div><div class="status-grid"><div class="status-cell"><span>人工检查</span><strong id="check-count">${state.checks.filter(Boolean).length} / 3 项已勾选</strong></div><div class="status-cell"><span>自动测试</span><strong>未运行</strong></div><div class="status-cell"><span>公开访问</span><strong>尚未发布</strong></div></div>${state.report?`<div class="receipt"><strong id="report-title">${reportTitle()}</strong><p id="report-message">上次记录 ${state.report.count} / 3 项。${reportMessage()}</p></div>`:''}${callout('<strong>勾选不会变成“自动测试通过”</strong><br>人工检查、自动测试与公开上线分别记录。')}<div class="card-actions">${button('不符合我的想法','feedback','ghost','message')}${button('保存检查记录','save-checks','primary','check')}</div>`,'核对结果');}
function contextPanel(){return `<button type="button" class="panel-back" data-act="open-guide">← 返回当前说明</button><div class="guide-eyebrow">同一个会话中的上下文</div><h2>目标与决定</h2><div class="context-block" style="margin-top:23px"><div class="eyebrow">当前目标 · 第 ${state.revision} 版</div><p>${esc(state.goal)}</p>${button('修改目标','edit-goal','small ghost','edit')}</div><div class="context-block"><div class="eyebrow">最近的原题回复</div><p>${state.choice?esc(state.sentReply):'还未回复内容维护问题。'}</p>${state.choice?callout(stale()?'旧问题的记录。当前目标或问题已变化，需要重新确认。':'仅在本地演示记录，未发送到真实 AI。',stale()):''}</div><div class="context-block"><div class="eyebrow">结果状态</div><p>预览：预制网页<br>自动测试：未运行<br>公开上线：未完成</p>${state.report?callout(`人工检查：${state.report.count} / 3 项。${reportMessage()}`):''}</div>${button('重置本地演示','reset','small ghost','undo')}`;}
function renderPanel(){const visible=state.panelOpen&&(state.paneTab==='files'||state.pluginEnabled);$('#app').classList.toggle('panel-open',visible);$('#host-panel').hidden=!visible;$('#guide-entry').hidden=!state.pluginEnabled;$('#guide-entry').setAttribute('aria-expanded',String(visible&&state.paneTab==='guide'));if(!visible){$('#host-panel').innerHTML='';return;}const isGuide=state.paneTab==='guide';$('#host-panel').innerHTML=`<div class="panel-tabs"><button type="button" class="panel-tab ${!isGuide?'active':''}" data-act="files" aria-pressed="${!isGuide}">文件</button>${state.pluginEnabled?`<button type="button" class="panel-tab ${isGuide?'active':''}" data-act="open-guide" aria-pressed="${isGuide}">${icon('compass',true)} VibeGuide</button>`:''}<button type="button" class="icon-btn" data-act="close-panel" aria-label="关闭会话侧栏">${icon('close',true)}</button></div><div class="panel-content">${isGuide?`<div class="panel-context"><span class="dot"></span>${state.panelView==='context'?'当前会话':panelLabel+' · 预设说明'}</div><section class="guide-card"><div class="guide-body">${state.panelView==='context'?contextPanel():panelContent}</div></section><p class="card-footnote">原型为展示效果展开侧栏；真实插件按需打开。右侧没有独立聊天窗口。</p>`:`<div class="file-tree">yuanshan-website/<br>├─ src/<br>│  ├─ App.tsx<br>│  └─ styles.css<br>├─ index.html<br>└─ package.json<div class="file-note">文件树是宿主界面的示意，没有读取或生成这些项目文件。</div></div>`}</div>${isGuide?`<div class="panel-footer"><button type="button" data-act="context">${icon('book',true)}目标与决定</button><button type="button" data-act="evidence">${icon('info',true)}说明依据</button></div>`:''}`;}
function nativeQuestionHTML(){return `<div class="native-question-head"><strong>${icon('message',true)} 内容维护方式</strong><span>Harness 原生问题 · v${state.questionVersion}</span></div><div class="question-scroll"><div class="flex between"><h2>是否需要接入 CMS，以支持内容维护？</h2>${state.pluginEnabled?`<button type="button" class="native-open-helper" data-act="open-guide" aria-label="用 VibeGuide 解释这道问题">${icon('compass',true)}<span>解释</span></button>`:''}</div><p class="native-description">不接入时直接修改前端内容；接入时需提供内容模型、编辑界面、身份认证和发布流程。</p><div class="native-options" role="radiogroup" aria-label="原始问题选项">${Object.entries(choices).map(([key,c])=>`<button type="button" class="native-option" id="native-${key}" data-act="native-choice" data-choice="${key}" role="radio" aria-checked="${state.candidate===key}" tabindex="${state.candidate===key||state.candidate==='custom'&&key==='ai'?'0':'-1'}"><span class="radio-dot"></span>${esc(c.native)}</button>`).join('')}</div><div class="native-custom"><label for="answer-draft">或者，用自己的话回答${state.candidate==='custom'?' · 将按原文发送':state.answerDraft?' · 草稿保留，本次不发送':''}</label><textarea id="answer-draft" rows="1" maxlength="700" placeholder="例如：每个月由市场同事更新一次，她不使用 AI 开发工具">${esc(state.answerDraft)}</textarea></div></div><div class="native-question-footer"><span id="native-selection-status">${state.candidate==='custom'?'使用自定义回复':'当前选择尚未发送'} · 只有此处发送</span><button type="button" class="btn primary" id="native-send" data-act="send-choice" ${canSend()?'':'disabled'}>模拟发送回复 ${icon('arrow',true)}</button></div>`;}
function render(focus=false){
 const old=document.activeElement,id=old?.id,act=old?.dataset?.act,caret=old?.selectionStart,selectionEnd=old?.selectionEnd,activeChoice=old?.name==='update-choice'?old.value:null,scroll=$('.panel-content')?.scrollTop||0;
 $('#project-name').textContent=state.company+' · 公司介绍网页';$('#session-title').textContent='公司介绍网页';
 $('#scene-list').innerHTML=stages.map((a,i)=>`<button type="button" class="scene ${i===state.stage?'current':''}" data-act="stage" data-stage="${i}" ${i===state.stage?'aria-current="page"':''}><span class="scene-number">0${i+1}</span>${a[0]}</button>`).join('');
 $('#plugin-toggle').setAttribute('aria-checked',String(state.pluginEnabled));$('#plugin-status').textContent=state.pluginEnabled?'已启用 · 按需解释':'已关闭 · 宿主仍可使用';
 panelContent='';panelLabel='';$('#main').innerHTML=intro()+[stageIdea,stagePlan,stageChoice,stagePreview,stageCheck][state.stage]();
 const pending=state.stage===2&&!questionAnswered();$('#main').classList.toggle('has-question',pending);$('#native-question').hidden=!pending;$('#native-question').innerHTML=pending?nativeQuestionHTML():'';$('#composer-form').hidden=pending;$('#composer-input').value=state.composerDraft;
 renderPanel();if($('.panel-content'))$('.panel-content').scrollTop=scroll;
 if(focus)$('#page-title').focus({preventScroll:true});else if(old&&!old.isConnected){const next=id?document.getElementById(id):activeChoice?document.querySelector(`input[name="update-choice"][value="${activeChoice}"]`):act?document.querySelector(`[data-act="${act}"]`):null;if(next&&!next.hidden){next.focus({preventScroll:true});if(typeof caret==='number'&&next.setSelectionRange)next.setSelectionRange(caret,selectionEnd??caret);}}
 save();syncNav();
}
function navigate(stage){if(!Number.isInteger(stage)||stage<0||stage>4)return;clearInterval(buildTimer);state.stage=stage;state.panelView='current';render(true);window.scrollTo({top:0,behavior:'instant'});closeNav();if($('.panel-content'))$('.panel-content').scrollTop=0;}
const mobileQuery=window.matchMedia('(max-width:760px)');
const overlayQuery=window.matchMedia('(max-width:1020px)');
function panelIsOverlay(){return overlayQuery.matches&&!$('#host-panel').hidden;}
function syncNav(){const open=$('#sidebar').classList.contains('mobile-open')&&mobileQuery.matches,overlay=panelIsOverlay()&&!open;$('#sidebar').inert=(mobileQuery.matches&&!open)||overlay;$('.workspace').inert=open;$('.mobile-menu').setAttribute('aria-expanded',String(open));for(const selector of ['.topbar','.host-viewbar','.conversation-area'])$(selector).inert=overlay;$('.demo-strip').inert=open||overlay;$('#panel-scrim').hidden=!overlay;if(overlay){$('#host-panel').setAttribute('role','dialog');$('#host-panel').setAttribute('aria-modal','true');if(!$('#host-panel').contains(document.activeElement)&&!$('#drawer').open&&!$('#preview-dialog').open){const target=$('#host-panel h2')||$('#host-panel .panel-tab.active');if(target){target.tabIndex=-1;target.focus({preventScroll:true});}}}else{$('#host-panel').removeAttribute('role');$('#host-panel').removeAttribute('aria-modal');}}

function closeNav(){const wasOpen=$('#sidebar').classList.contains('mobile-open');$('#sidebar').classList.remove('mobile-open');$('#scrim').classList.remove('show');syncNav();if(wasOpen&&mobileQuery.matches)$('.mobile-menu').focus({preventScroll:true});}
mobileQuery.addEventListener('change',()=>{if(!mobileQuery.matches)closeNav();else syncNav();});
overlayQuery.addEventListener('change',syncNav);
function openPanel(tab='guide',view='current'){if(tab==='guide'&&!state.pluginEnabled)return;panelReturnFocus=document.activeElement;state.panelOpen=true;state.paneTab=tab;state.panelView=view;render();const target=$('#host-panel h2')||$('#host-panel .panel-tab.active');if(target){target.tabIndex=-1;target.focus({preventScroll:true});}}
function closePanel(restore=true){state.panelOpen=false;render();if(restore){const target=panelReturnFocus?.isConnected?panelReturnFocus:state.pluginEnabled?$('#guide-entry'):document.querySelector('[data-act="files"]');target?.focus({preventScroll:true});}}
function focusAnswer(){if(overlayQuery.matches)closePanel(false);const target=questionAnswered()?$('#answer-receipt'):state.candidate==='custom'?$('#answer-draft'):$('#native-send');target?.focus();target?.scrollIntoView({block:'nearest'});}
function changeGoal(company,goal,amendment){const name=company.trim(),text=goal.trim();if(!name||!text){toast('请保留公司名称和目标描述。');return false;}if(name===state.company&&text===state.goal)return true;state.company=name;state.goal=text;state.revision++;reopenQuestion();state.amendments.push(amendment||'修改了目标描述，需重新核对方案。');save();return true;}
function closeDrawer(){$('#drawer').close();}
function openDrawer(kind){if(!$('#drawer').open)returnFocus=document.activeElement;let title='',subtitle='',body='';
 if(kind==='edit-goal'){title='调整这次的目标';subtitle='仍属于同一个 Harness 会话';body=`<form id="edit-form"><label class="field" style="margin-top:0"><span class="field-label">公司名称</span><input name="company" value="${esc(state.company)}" required maxlength="32"></label><label class="field"><span class="field-label">希望做出的结果</span><textarea name="goal" style="min-height:160px" required maxlength="1200">${esc(state.goal)}</textarea></label><div class="drawer-note">保存后会标记旧决定与验收记录。此原型只记录目标，不会自动重写技术方案或预制网站。</div><div class="dialog-footer">${button('取消','close-drawer','ghost','')}<button type="submit" class="btn primary">保存目标 ${icon('check',true)}</button></div></form>`;}
 if(kind==='evidence'){title='这段说明的依据';subtitle='预设内容与真实验证明确分开';body=`<section class="drawer-section"><div class="eyebrow">当前目标 · 第 ${state.revision} 版</div><p>${esc(state.goal)}</p></section><section class="drawer-section"><div class="eyebrow">关联问题</div><p>content-maintenance · v${state.questionVersion}<br>原问题与选项保留在原会话。右侧选项对应同一份草稿；自定义回答按原文保留。</p></section><section class="drawer-section"><div class="eyebrow">尚未验证</div><p>没有接入真实 DeepSeek Harness、调用模型或读取项目。提问、解释、进度与网站均预先编写。</p></section><div class="drawer-note">页面结构参考 Harness 官方的会话、原生问题和右侧栏文档。消息旁入口、双向草稿同步和原题回传仍需真实插件技术验证。这不是官方界面的逐像素复刻。</div>`;}
 if(kind==='feedback'){title='哪里和你想的不一样？';subtitle='描述你看到的结果即可';body=`<form id="feedback-form"><label class="field" style="margin-top:0"><span class="field-label">你做了什么？</span><input name="action" placeholder="例如：在手机上打开案例区域" required maxlength="200"></label><label class="field"><span class="field-label">实际看到了什么？</span><textarea name="actual" placeholder="例如：案例图片太小" required maxlength="400"></textarea></label><label class="field"><span class="field-label">你希望是什么样？</span><textarea name="expected" placeholder="例如：每次展示一张大图" required maxlength="400"></textarea></label><div class="drawer-note">整理后放回原会话输入框，由你查看并发送。不会在侧栏里开启第二个对话。</div><div class="dialog-footer">${button('取消','close-drawer','ghost','')}<button type="submit" class="btn primary">放入会话草稿 ${icon('arrow',true)}</button></div></form>`;}
 if(kind==='help'){title='这是 Harness 里的插件体验';subtitle='可点击的集成概念原型，尚未实现真实插件';body=`<section class="drawer-section"><h3>外层属于 DeepSeek Harness</h3><p>左边是工作区和会话，中间是原对话与输入区。原生问题仍由 Harness 提出和接收答案。</p></section><section class="drawer-section"><h3>VibeGuide 在需要时出现</h3><p>点击消息旁的解释入口，打开右侧 VibeGuide 标签。它解释计划、选择的影响和结果，没有第二个聊天输入框。</p></section><section class="drawer-section"><h3>试试同一道问题的两种表述</h3><p>① 在右侧选择“同事需要自己更新”<br>② 观察左侧原生问题同步改选<br>③ 点击原生问题的“模拟发送回复”<br>④ 关闭左侧 VibeGuide 开关，宿主仍可使用<br>⑤ 用顶部演示控制切换方案、预览和验收</p></section><div class="drawer-note">顶部五个场景仅供展示，不是插件的步骤导航，也不表示工作完成。为展示效果，首次默认展开侧栏；实际产品按需打开。所有输入仅保存在此浏览器，不调用 AI、修改项目或发布网站。</div><div class="dialog-footer">${button('重置演示','reset','ghost','undo')}${button('继续体验','close-drawer','primary','check')}</div>`;}
 $('#drawer').innerHTML=`<header class="dialog-head"><div><h2>${title}</h2><p>${subtitle}</p></div><button type="button" class="icon-btn" data-act="close-drawer" aria-label="关闭详情">${icon('close')}</button></header><div class="dialog-body">${body}</div>`;if(!$('#drawer').open)$('#drawer').showModal();}
function renderProgress(){document.querySelectorAll('.timeline-item').forEach((el,i)=>{el.classList.toggle('done',state.buildPhase>i);el.classList.toggle('active',state.buildPhase===i);el.querySelector('.timeline-dot').innerHTML=state.buildPhase>i?icon('check',true):state.buildPhase===i?icon('clock',true):'<span style="font-size:10px">'+(i+1)+'</span>';});const b=document.querySelector('[data-act="play-build"]');if(b)b.innerHTML=(state.buildPhase===3?'重播过程示意':'正在播放示意…')+icon('play',true);save();}
function playBuild(){clearInterval(buildTimer);state.buildPhase=0;renderProgress();buildTimer=setInterval(()=>{if(state.stage!==3||!state.pluginEnabled){clearInterval(buildTimer);return;}state.buildPhase++;renderProgress();if(state.buildPhase>=3){clearInterval(buildTimer);toast('过程示意播放完毕；没有实际执行开发操作。');}},900);}

53}.card h3{font-weight:550;font-size:15px}.card p{font-size:11px;color:#929b83}.cases{display:grid;grid-template-columns:1fr 1fr;gap:20px}.case{background:#e2e6d7;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}.case span{font-size:10px;color:#8b977d}.case strong{font-size:14px;font-weight:500}.contact{background:#36432d;color:#e8eede}.contact p{font-size:12px;color:#b1bea1}.contact .placeholder{border:1px dashed #748663;padding:12px 18px;display:inline-block;margin-top:12px;font-size:12px;color:#c4d0b6}footer{font-size:9px;padding:20px 6%;color:#99a18e;display:flex;justify-content:space-between}@media(max-width:550px){header{padding:18px 6%}.logo{font-size:17px}nav{gap:10px;font-size:9px}nav a:first-child{display:none}.hero{grid-template-columns:1fr;padding:35px 6%;gap:28px}.hero h1{font-size:30px}.art{min-height:220px}.ring{width:135px;height:135px;border-width:27px}.ring:after{inset:12px;border-width:9px}.cards{grid-template-columns:1fr;gap:12px}.card{padding:16px}.card h3{margin:6px 0}.section{padding:34px 6%}.section h2{font-size:22px}.cases{grid-template-columns:1fr}.case{min-height:110px}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><header><a href="about:srcdoc#top" class="logo"><span>↗</span>${esc(state.company)}</a><nav><a href="about:srcdoc#about">关于我们</a><a href="about:srcdoc#services">业务</a><a href="about:srcdoc#cases">案例</a><a href="about:srcdoc#contact">联系</a></nav></header><main><section class="hero" id="top"><div><small>YUANSHAN · MANUFACTURING</small><h1>把每一份信任，<br>做成可靠的交付。</h1><p>从需求沟通到生产交付，让每一个细节都有回应。这里是待替换的公司介绍示例。</p><a class="cta" href="about:srcdoc#contact">联系团队 ↗</a></div><div class="art" aria-label="工业零件几何示意"><div class="ring"></div><span class="art-caption">PRECISION IN EVERY DETAIL / 示意图</span></div></section><section class="section" id="about"><small>01 / ABOUT</small><h2>踏实做事，长期同行。</h2><p style="font-size:12px;color:#859276;max-width:650px">这里将介绍公司的真实背景、团队与服务理念。公司资料尚未提供，本页没有填入未经核实的成立时间、客户数量或资质。</p></section><section class="section" id="services"><small>02 / OUR SERVICES</small><h2>围绕需求，做好每一环。</h2><div class="cards"><article class="card"><span>01</span><h3>需求沟通</h3><p>业务介绍占位：说明你们能帮助客户解决什么问题。</p></article><article class="card"><span>02</span><h3>生产与制造</h3><p>业务介绍占位：补充真实的产品与服务范围。</p></article><article class="card"><span>03</span><h3>交付与支持</h3><p>业务介绍占位：说明交付流程与后续支持。</p></article></div></section><section class="section" id="cases"><small>03 / SELECTED WORK</small><h2>让成果，讲述我们的工作。</h2><div class="cases"><article class="case"><span>案例图片待提供</span><strong>项目名称与真实成果待补充</strong></article><article class="case"><span>案例图片待提供</span><strong>项目名称与真实成果待补充</strong></article></div></section><section class="section contact" id="contact"><small>LET'S TALK</small><h2>从一次交流开始。</h2><p>告诉我们你的需求，一起探讨合适的合作方式。</p><div class="placeholder">联系电话与公司邮箱待填写</div></section></main><footer><span>${esc(state.company)} · 公司介绍网页示意</span><span>虚构案例 / 预制页面 / 尚未发布</span></footer></body></html>`;}
function openPreview(){returnFocus=document.activeElement;$('#preview-dialog').innerHTML=`<header class="dialog-head"><div><h2>公司网站示意</h2><p>预制页面 · 不是 AI 实际生成的成果</p></div><div class="flex"><div class="device-switch" aria-label="预览宽度"><button class="active" data-act="device" data-device="desktop" aria-pressed="true">${icon('desktop',true)}电脑</button><button data-act="device" data-device="mobile" aria-pressed="false">${icon('phone',true)}窄屏</button></div><button class="icon-btn" data-act="close-preview" aria-label="关闭网站预览">${icon('close')}</button></div></header><div class="preview-area" id="preview-area"><iframe title="远山制造公司网站预制示意" id="site-frame" sandbox=""></iframe></div><div class="preview-caption">文字、图片与联系方式含占位内容 · 此预览不包含后台或在线留言 · 尚未公开上线</div>`;$('#site-frame').srcdoc=siteHTML();$('#preview-dialog').showModal();}

function syncDraftUI(){document.querySelectorAll('.native-option').forEach(b=>{b.setAttribute('aria-checked',String(state.candidate===b.dataset.choice));b.tabIndex=state.candidate===b.dataset.choice||state.candidate==='custom'&&b.dataset.choice==='ai'?0:-1;});if($('#native-send'))$('#native-send').disabled=!canSend();if($('#native-selection-status'))$('#native-selection-status').textContent=(state.candidate==='custom'?'使用自定义回复':'当前选择尚未发送')+' · 只有此处发送';const label=document.querySelector('label[for="answer-draft"]');if(label)label.textContent='或者，用自己的话回答'+(state.candidate==='custom'?' · 将按原文发送':state.answerDraft?' · 草稿保留，本次不发送':'');const scroll=$('.panel-content')?.scrollTop||0;if(state.stage===2)panelContent=choicePanel();renderPanel();if($('.panel-content'))$('.panel-content').scrollTop=scroll;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==='stage')navigate(Number(b.dataset.stage));
 if(a==='session'){closeNav();$('#page-title').focus({preventScroll:true});}
 if(a==='new-session')toast('此原型只演示一个公司网页会话；可以用顶部控制切换预设场景。');
 if(a==='next-question')navigate(2);
 if(a==='go-preview')navigate(3);
 if(a==='go-check')navigate(4);
 if(a==='toggle-plugin'){setPluginEnabled(!state.pluginEnabled);render();toast(state.pluginEnabled?'VibeGuide 已启用，可点击解释入口打开。':'VibeGuide 已关闭。原会话、问题选择和草稿均保留。');}
 if(a==='open-guide')openPanel();
 if(a==='context')openPanel('guide','context');
 if(a==='files')openPanel('files');
 if(a==='close-panel')closePanel();
 if(a==='focus-answer')focusAnswer();
 if(a==='native-choice'&&selectCandidate(b.dataset.choice))render();
 if(['edit-goal','help','evidence','feedback'].includes(a))openDrawer(a);
 if(a==='close-drawer')closeDrawer();
 if(a==='open-preview')openPreview();
 if(a==='close-preview')$('#preview-dialog').close();
 if(a==='device'){const mobile=b.dataset.device==='mobile';$('#preview-area').classList.toggle('mobile',mobile);document.querySelectorAll('[data-act="device"]').forEach(el=>{el.classList.toggle('active',el===b);el.setAttribute('aria-pressed',String(el===b));});}
 if(a==='send-choice'&&commitDecision()){render();$('#answer-receipt')?.focus({preventScroll:true});toast('原题回复已记录在本地演示中；没有发送到真实 AI。');}
 if(a==='reopen-question'&&questionAnswered()){reopenQuestion();render();$('#native-ai')?.focus({preventScroll:true});toast('已创建新一轮确认；上一轮回复保留为旧记录。');}
 if(a==='play-build')playBuild();
 if(a==='save-checks'){recordChecks();render();toast(`已保存 ${state.report.count}/3 项人工检查记录，仅用于当前演示版本。`);}
 if(a==='menu'){$('#sidebar').classList.add('mobile-open');$('#scrim').classList.add('show');syncNav();$('.host-session').focus({preventScroll:true});}
 if(a==='close-nav')closeNav();
 if(a==='reset'){clearInterval(buildTimer);state=freshState();if($('#drawer').open)closeDrawer();render(true);window.scrollTo({top:0,behavior:'instant'});toast('已重置为“回答问题”场景。');}
});
document.addEventListener('input',e=>{if(e.target.id==='answer-draft'&&updateAnswerDraft(e.target.value))syncDraftUI();if(e.target.id==='composer-input'){state.composerDraft=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.name==='update-choice'&&selectCandidate(e.target.value)){render();if(state.candidate==='custom')focusAnswer();}if(e.target.name==='check'){state.checks[Number(e.target.value)]=e.target.checked;$('#check-count').textContent=state.checks.filter(Boolean).length+' / 3 项已勾选';if($('#report-title')){$('#report-title').textContent=reportTitle();$('#report-message').textContent='上次记录 '+state.report.count+' / 3 项。'+reportMessage();}save();}});
document.addEventListener('submit',e=>{
 if(e.target.id==='edit-form'){e.preventDefault();const fd=new FormData(e.target);if(!changeGoal(fd.get('company'),fd.get('goal')))return;closeDrawer();navigate(1);toast('目标已保存。请核对预设方案；旧问题与检查记录已标记版本。');}
 if(e.target.id==='composer-form'){e.preventDefault();const value=state.composerDraft.trim();if(!value){$('#composer-input').focus();return;}changeGoal(state.company,state.goal+'\n补充：'+value,value);state.composerDraft='';navigate(1);toast('已在本地模拟记录新要求。预制方案与网页不会自动改写。');}
 if(e.target.id==='feedback-form'){e.preventDefault();const fd=new FormData(e.target);const note=`我做了：${fd.get('action')}；实际：${fd.get('actual')}；希望：${fd.get('expected')}`;state.composerDraft=(state.composerDraft?state.composerDraft+'\n':'')+note;closeDrawer();if(overlayQuery.matches)state.panelOpen=false;render();$('#composer-input').focus();toast('修改意见已放入 Harness 会话草稿，尚未发送。');}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&panelIsOverlay()&&!$('#drawer').open&&!$('#preview-dialog').open){const nodes=[...$('#host-panel').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]')].filter(n=>n.offsetParent!==null&&n.tabIndex>=0);const first=nodes[0],last=nodes.at(-1),active=document.activeElement;if(first&&last){if(e.shiftKey&&(active===first||!nodes.includes(active))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(active===last||!nodes.includes(active))){e.preventDefault();first.focus();}}}
 if(e.key==='Escape'&&!$('#drawer').open&&!$('#preview-dialog').open){if($('#sidebar').classList.contains('mobile-open'))closeNav();else if(state.panelOpen)closePanel();}
 if(e.target.id==='composer-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#composer-form').requestSubmit();}
 if(e.target.matches('.native-option')&&['ArrowDown','ArrowUp','ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const keys=Object.keys(choices),i=keys.indexOf(e.target.dataset.choice);const next=e.key==='Home'?0:e.key==='End'?keys.length-1:(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)+keys.length)%keys.length;if(selectCandidate(keys[next])){render();$('#native-'+keys[next]).focus({preventScroll:true});}}
});
for(const d of [$('#drawer'),$('#preview-dialog')]){d.addEventListener('close',()=>{const fallback=state.pluginEnabled&&!$('#guide-entry').hidden?$('#guide-entry'):$('#page-title');(returnFocus?.isConnected?returnFocus:fallback)?.focus({preventScroll:true});});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});}
render();
